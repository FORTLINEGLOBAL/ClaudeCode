[build]
  command = "npm run typecheck && npm test"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# Daily check-ins: every 15 minutes, each parent is checked against their own
# local check-in time, quiet hours and consent.
[functions.checkin]
  schedule = "*/15 * * * *"
